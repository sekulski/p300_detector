name: "🐞 Bug Report"
description: Report a bug or unexpected behavior
title: "🐞 [BUG] - <short description>"
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: "What happened?"
      description: Describe the bug clearly and briefly.
      placeholder: "Something doesn't work as expected when..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: How can we see the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: What did you expect to happen?
      placeholder: "I expected it to..."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots"
      description: Add any screenshots that help explain the issue.
      placeholder: "Drag and drop images here or paste links"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Logs or Output"
      description: Paste any error messages or logs here.
      placeholder: "Error: something went wrong at line 42..."
      render: bash
    validations:
      required: false
