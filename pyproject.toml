[tool.poetry]
name = "p300-detector"
version = "0.1.0"
description = ""
authors = ["niewyspany <triss@tuta.io>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
matplotlib = "^3.8"
tk = "*"
brainaccess = { path = "../BrainAccessSDK-linux/python_api" }
pyqt6 = "^6.8.1"
pyqtgraph = "^0.13.7"

[tool.poetry.group.dev.dependencies]
isort = "^6.0.1"
pre-commit = "^4.2.0"
black = "^25.1.0"

[tool.isort]
profile = "black"
known_first_party = ["gui", "scripts"]

[tool.black]
line-length = 88
target-version = ["py312"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
